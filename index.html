<!DOCTYPE html>

<html lang="en-us">
<head>
  <meta charset="utf-8"/>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<title>Unity WebGL Player | AUTOMECHANIC_CREATE_CAR_0.2</title>
<link rel="shortcut icon" href="TemplateData/favicon.ico"/>
<link rel="stylesheet" href="TemplateData/style.css"/>
<link rel="stylesheet" href="TemplateData/style.css"/>
<!-- Yandex Games SDK -->
<script src="sdk.js"></script>
   <script>
        var sdk;
       YaGames.init()
        .then(ysdk => {
            sdk = ysdk;
            window.ysdk = ysdk;
          });
    </script> 
<style>
  body {
    /* Убираем скролл */
    overflow: hidden;
    /* Убираем лонгтап на IOS */
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    -khtml-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:rgba(0,0,0,0);
  }
</style>
</head>
<body>
<div id="unity-container" style="position: absolute; width: 100%; height: 100%; left: 0%; top: 0%;">
<canvas id="unity-canvas" style="position: absolute; width: 100%; height: 100%;"></canvas>
<div id="unity-loading-bar">
<div id="unity-logo"></div>
<div id="unity-progress-bar-empty">
<div id="unity-progress-bar-full"></div>
</div>
</div>
<div id="unity-warning"> </div>
</div>

<script>
  var container = document.querySelector("#unity-container");
  var canvas = document.querySelector("#unity-canvas");
  var loadingBar = document.querySelector("#unity-loading-bar");
  var progressBarFull = document.querySelector("#unity-progress-bar-full");
  var warningBanner = document.querySelector("#unity-warning");

  function unityShowBanner(msg, type) {
    function updateBannerVisibility() {
      warningBanner.style.display =
        warningBanner.children.length ? "block" : "none";
    }

    var div = document.createElement("div");
    div.innerHTML = msg;
    warningBanner.appendChild(div);

    if (type == "error") {
      div.style = "background: red; padding: 10px;";
    } else {
      if (type == "warning") {
        div.style = "background: yellow; padding: 10px;";
      }

      setTimeout(function () {
        if (div.parentNode) {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }
      }, 5000);
    }

    updateBannerVisibility();
  }


  /* =========================
     YANDEX GAMES SDK
     ========================= */

  var sdk = null;

  var sdkReady = YaGames.init()
    .then(function (ysdk) {
      sdk = ysdk;
      window.ysdk = ysdk;

      console.log("Yandex SDK initialized");

      return ysdk;
    })
    .catch(function (error) {
      console.error("Yandex SDK initialization failed:", error);
      return null;
    });


  /* =========================
     UNITY
     ========================= */

  var buildUrl = "Build";

  var loaderUrl =
    buildUrl + "/CreateCar_4.6F.loader.js";

  var config = {
    dataUrl:
      buildUrl + "/CreateCar_4.6F.data.br",

    frameworkUrl:
      buildUrl + "/CreateCar_4.6F.framework.js.br",

    codeUrl:
      buildUrl + "/CreateCar_4.6F.wasm.br",

    streamingAssetsUrl: "StreamingAssets",

    companyName: "ZG",

    productName:
      "AUTOMECHANIC_CREATE_CAR_0.2",

    productVersion: "3.2",

    showBanner: unityShowBanner
  };


  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

    var meta = document.createElement("meta");

    meta.name = "viewport";

    meta.content =
      "width=device-width, height=device-height, " +
      "initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

    document
      .getElementsByTagName("head")[0]
      .appendChild(meta);

    container.className = "unity-mobile";
    canvas.className = "unity-mobile";

    canvas.style.width = "100%";
    canvas.style.height = "100%";

  } else {

    canvas.style.width = "100%";
    canvas.style.height = "100%";

  }


  canvas.style.background =
    "url('" +
    buildUrl +
    "/CreateCar_4.6F.jpg.br') center / cover";


  loadingBar.style.display = "block";


  var unityI = null;
  var myGameInstance = null;


  var script = document.createElement("script");

  script.src = loaderUrl;


  script.onload = function () {

    createUnityInstance(
      canvas,
      config,

      function (progress) {
        progressBarFull.style.width =
          100 * progress + "%";
      }

    ).then(function (unityInstance) {

      unityI = unityInstance;
      myGameInstance = unityInstance;

      loadingBar.style.display = "none";

      console.log("Unity loaded");

    }).catch(function (message) {

      console.error("Unity failed to load:", message);

      alert(message);

    });

  };


  /* =========================
     CALLED FROM UNITY
     ========================= */

  async function Start() {

    console.log("Unity called Start()");

    var ysdk = await sdkReady;


    if (!ysdk) {

      console.warn(
        "Yandex SDK isn't available."
      );

      return;

    }


    if (!unityI) {

      console.warn(
        "Unity instance isn't ready yet."
      );

      return;

    }


    var data = ysdk.environment || {};


    console.log(
      "Yandex environment:",
      data
    );


    unityI.SendMessage(
      "LANG",
      "SET_LANG",
      JSON.stringify(data)
    );

  }


  function GameReady() {

    if (
      window.ysdk &&
      window.ysdk.features &&
      window.ysdk.features.LoadingAPI
    ) {

      window.ysdk.features.LoadingAPI.ready();

    }

    console.log(
      "Game loaded ..."
    );

  }


  document.body.appendChild(script);

</script>
</body>
</html>
